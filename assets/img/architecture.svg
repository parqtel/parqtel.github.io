<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Parqtel system architecture">
  <defs>
    <linearGradient id="server" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#18b6ff" stop-opacity="0.12"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9z" fill="#7c5cff"/>
    </marker>
    <marker id="dash" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9z" fill="#5a6478"/>
    </marker>
  </defs>

  <!-- Sources -->
  <g font-size="13" font-weight="600" fill="#0e1424">
    <rect x="60" y="64" width="180" height="54" rx="10" fill="#fff" stroke="#d3d7e4"/>
    <text x="150" y="96" text-anchor="middle">Apps / OTel SDKs</text>
    <rect x="270" y="64" width="170" height="54" rx="10" fill="#fff" stroke="#d3d7e4"/>
    <text x="355" y="96" text-anchor="middle">Grafana</text>
    <rect x="470" y="64" width="210" height="54" rx="10" fill="#fff" stroke="#d3d7e4"/>
    <text x="575" y="96" text-anchor="middle">MCP / LLM Agents</text>
    <text x="60" y="48" font-size="11" fill="#8a93a6" font-weight="700" letter-spacing="1">SIGNAL SOURCES</text>
  </g>

  <!-- Server -->
  <g>
    <rect x="60" y="150" width="620" height="118" rx="12" fill="url(#server)" stroke="#7c5cff"/>
    <text x="80" y="176" font-size="14" font-weight="700" fill="#0e1424">parqtel-server · Axum HTTP</text>
    <g font-size="11.5" font-weight="600" fill="#0e1424">
      <rect x="80" y="190" width="138" height="62" rx="8" fill="#fff" stroke="#d3d7e4"/>
      <text x="149" y="225" text-anchor="middle">OTLP</text>
      <text x="149" y="240" text-anchor="middle" font-size="9.5" fill="#5a6478">handlers</text>
      <rect x="228" y="190" width="138" height="62" rx="8" fill="#fff" stroke="#d3d7e4"/>
      <text x="297" y="225" text-anchor="middle">Prometheus API</text>
      <text x="297" y="240" text-anchor="middle" font-size="9.5" fill="#5a6478">v1</text>
      <rect x="376" y="190" width="148" height="62" rx="8" fill="#fff" stroke="#d3d7e4"/>
      <text x="450" y="225" text-anchor="middle">Grafana</text>
      <text x="450" y="240" text-anchor="middle" font-size="9.5" fill="#5a6478">SimpleJSON</text>
      <rect x="534" y="190" width="138" height="62" rx="8" fill="#fff" stroke="#d3d7e4"/>
      <text x="603" y="225" text-anchor="middle">Alert API</text>
      <text x="603" y="240" text-anchor="middle" font-size="9.5" fill="#5a6478">+ UI</text>
    </g>
  </g>

  <!-- Services -->
  <g font-size="12.5" font-weight="650" fill="#0e1424">
    <text x="60" y="294" font-size="11" fill="#8a93a6" font-weight="700" letter-spacing="1">SERVICES</text>
    <rect x="60" y="300" width="145" height="70" rx="10" fill="#fff" stroke="#d3d7e4"/>
    <text x="132" y="340" text-anchor="middle">Ingest</text>
    <rect x="222" y="300" width="145" height="70" rx="10" fill="#fff" stroke="#d3d7e4"/>
    <text x="294" y="340" text-anchor="middle">Query</text>
    <rect x="384" y="300" width="145" height="70" rx="10" fill="#fff" stroke="#d3d7e4"/>
    <text x="456" y="340" text-anchor="middle">Pipeline</text>
    <rect x="546" y="300" width="134" height="70" rx="10" fill="#fff" stroke="#d3d7e4"/>
    <text x="613" y="340" text-anchor="middle">Alert</text>
  </g>

  <!-- Core -->
  <g>
    <rect x="60" y="408" width="620" height="122" rx="12" fill="#fff" stroke="#18b6ff"/>
    <text x="80" y="432" font-size="14" font-weight="700" fill="#0e1424">parqtel-core</text>
    <g font-size="11.5" font-weight="600" fill="#0e1424">
      <rect x="80" y="446" width="142" height="64" rx="8" fill="#f6f7fb" stroke="#d3d7e4"/>
      <text x="151" y="482" text-anchor="middle">Storage Engine</text>
      <rect x="236" y="446" width="142" height="64" rx="8" fill="#f6f7fb" stroke="#d3d7e4"/>
      <text x="307" y="482" text-anchor="middle">Block Index</text>
      <rect x="392" y="446" width="142" height="64" rx="8" fill="#f6f7fb" stroke="#d3d7e4"/>
      <text x="463" y="482" text-anchor="middle">Compactor</text>
      <rect x="548" y="446" width="120" height="64" rx="8" fill="#f6f7fb" stroke="#d3d7e4"/>
      <text x="608" y="482" text-anchor="middle">Retention</text>
    </g>
  </g>

  <!-- Storage -->
  <g>
    <rect x="60" y="556" width="620" height="62" rx="10" fill="#0e1424"/>
    <text x="370" y="592" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Parquet + Zstd · filesystem (self-contained block files)</text>
  </g>

  <!-- MCP panel -->
  <g>
    <rect x="720" y="150" width="220" height="468" rx="12" fill="#fff" stroke="#d3d7e4" stroke-dasharray="5 4"/>
    <text x="830" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#0e1424">MCP Servers (7)</text>
    <text x="830" y="196" text-anchor="middle" font-size="9.5" fill="#8a93a6">separate binaries · JSON-RPC</text>
    <g font-size="11" font-weight="600" fill="#0e1424">
      <rect x="735" y="210" width="190" height="46" rx="8" fill="#f6f7fb" stroke="#d3d7e4"/><text x="830" y="237" text-anchor="middle">Slack · 3001</text>
      <rect x="735" y="264" width="190" height="46" rx="8" fill="#f6f7fb" stroke="#d3d7e4"/><text x="830" y="291" text-anchor="middle">PagerDuty · 3002</text>
      <rect x="735" y="318" width="190" height="46" rx="8" fill="#f6f7fb" stroke="#d3d7e4"/><text x="830" y="345" text-anchor="middle">Jira · 3003</text>
      <rect x="735" y="372" width="190" height="46" rx="8" fill="#f6f7fb" stroke="#d3d7e4"/><text x="830" y="399" text-anchor="middle">Notion · 3004</text>
      <rect x="735" y="426" width="190" height="46" rx="8" fill="#f6f7fb" stroke="#d3d7e4"/><text x="830" y="453" text-anchor="middle">Discord · 3005</text>
      <rect x="735" y="480" width="190" height="46" rx="8" fill="#f6f7fb" stroke="#d3d7e4"/><text x="830" y="507" text-anchor="middle">Google Docs · 3006</text>
      <rect x="735" y="534" width="190" height="46" rx="8" fill="#f6f7fb" stroke="#d3d7e4"/><text x="830" y="561" text-anchor="middle">Parqtel · 3007</text>
    </g>
  </g>

  <!-- Arrows -->
  <g fill="none" stroke="#7c5cff" stroke-width="2" marker-end="url(#arrow)">
    <path d="M150 118 V150"/>
    <path d="M355 118 V150"/>
    <path d="M575 118 V150"/>
    <path d="M370 268 V300"/>
    <path d="M370 370 V408"/>
    <path d="M370 530 V556"/>
  </g>
  <g fill="none" stroke="#5a6478" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#dash)">
    <path d="M680 209 H720"/>
    <path d="M830 118 C 900 118, 910 150, 880 158"/>
  </g>
</svg>

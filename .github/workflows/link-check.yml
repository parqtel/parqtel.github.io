name: Link check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permissions: read-only, least privilege.
permissions:
  contents: read

jobs:
  links:
    name: Validate internal links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No third-party action or network needed: a small, dependency-free
      # checker verifies every internal href/src and #anchor resolves.
      # For external-link monitoring, add lycheeverse/lychee-action separately.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check links
        run: python3 scripts/check_links.py
